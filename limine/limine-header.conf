### Swiss theme: from omarchy-swiss/limine (install-limine.sh)
### Read more at config document: https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md
#timeout: 3
default_entry: 2
hash_mismatch_panic: no

# Bottom-left type block and hairline live in the wallpaper
wallpaper: boot():/swiss-boot.png
wallpaper_style: stretched
backdrop: 101315

# Branding drawn in the background colour (hidden); key help is in the wallpaper
interface_branding: Omarchy
interface_branding_color: 101315
interface_help_hidden: yes
interface_help_color: 4b4e55
interface_help_color_bright: cacccc

# Native panel mode, so the 2x font and the wallpaper stay crisp
interface_resolution: 2880x1800

# Menu font: Terminus 8x16 in CP437 order (gen-font.py), doubled for the
# 2880x1800 panel, no extra tracking
term_font: boot():/swiss-font.bin
term_font_size: 8x16
term_font_scale: 2x2
term_font_spacing: 0

# Transparent terminal over the wallpaper, no gradient frame
term_background: ff101315
term_margin_gradient: 0

# Terminal colors (Solitude palette)
term_palette: 101315;de6145;9fa5a9;d9dbdc;798186;aeaeae;707070;cacccc
term_palette_bright: 4b4e55;de6145;343d41;c9c2b4;5d6367;9a9a9a;707070;cacccc

# Text colors
term_foreground: cacccc
term_foreground_bright: cacccc
term_background_bright: 343d41

